<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" width="1200" height="10" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="p" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff4d4d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff4d4d" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="0" y="0" width="1200" height="10"/></clipPath>
  </defs>
  <style>
    .pulse { animation: run 5s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes run { from { transform: translateX(-220px); } to { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; transform: translateX(490px); } }
  </style>
  <rect x="0" y="4.5" width="1200" height="1" fill="#8a8a94" fill-opacity="0.35"/>
  <g clip-path="url(#c)">
    <rect class="pulse" x="0" y="3.5" width="220" height="3" rx="1.5" fill="url(#p)"/>
  </g>
</svg>
